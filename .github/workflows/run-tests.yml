name: Run Tests

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4, 8.5]
        laravel: ['12.*', '13.*']
        imagemagick: [im-7.1.2-36_aom-3.13.3_heif-1.23.7_jxl-0.13.0] # IMEI release tag
        coverage: [none]
        dependency-version: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ":imagick" disables any preinstalled imagick, so PIE's build is the one used
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, bcmath, fileinfo, gd, xdebug, :imagick
          tools: composer:v2, pie
          ini-values: xdebug.mode="coverage"
          coverage: xdebug

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ImageMagick (prebuilt packages from IMEI)
        run: |
          git clone --depth 1 https://github.com/SoftCreatR/imei "$RUNNER_TEMP/imei"
          cd "$RUNNER_TEMP/imei"
          sudo ./imei.sh --prebuilt-only --release-tag "${{ matrix.imagemagick }}"
          magick -version

      - name: Install Imagick PHP extension with PIE
        run: |
          sudo pie install imagick/imagick \
            --with-php-config="$(command -v php-config)" \
            --with-imagick=/opt/imei
          php --ri imagick

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Install optimizers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jpegoptim pngquant gifsicle optipng libjpeg-progs webp
          npm install -g svgo

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-suggest

      - name: GD Version
        run: php -r 'var_dump(gd_info());'

      - name: Imagick Version
        run: php -r 'var_dump(Imagick::getVersion());'

      - name: Supported Imagick Formats
        run: php -r 'var_dump(Imagick::queryFormats());'

      - name: Execute tests
        run: composer test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
