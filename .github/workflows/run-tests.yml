name: Run Tests

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4, 8.5]
        laravel: ['12.*', '13.*']
        imagemagick: [7.1.2-8]
        imagick: [3.8.1]
        coverage: [none]
        dependency-version: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, bcmath, fileinfo, gd, xdebug
          tools: composer:v2
          ini-values: xdebug.mode="coverage"
          coverage: xdebug

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Prepare environment for Imagemagick
        run: |
          sudo apt-get -y remove imagemagick imagemagick-6-common libmagic-dev
          sudo apt-get update --fix-missing
          sudo apt-get install -y libjpeg-dev libgif-dev libtiff-dev libpng-dev libwebp-dev libavif-dev libheif-dev
          sudo apt-get install -y libmagickwand-dev

      - name: Cache ImageMagick
        uses: actions/cache@v4
        id: cache-imagemagick
        with:
          path: /home/runner/im/imagemagick-${{ matrix.imagemagick }}
          key: ${{ runner.os }}-ImageMagick-${{ matrix.imagemagick }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-ImageMagick-${{ matrix.imagemagick }}-

      - name: Install ImageMagick
        if: steps.cache-imagemagick.outputs.cache-hit != 'true'
        run: |
          curl -o /tmp/ImageMagick.tar.gz -sL https://github.com/ImageMagick/ImageMagick/archive/refs/tags/${{ matrix.imagemagick }}.tar.gz
          (
            cd /tmp || exit 1
            tar xf ImageMagick.tar.gz
            cd ImageMagick-${{ matrix.imagemagick }}
            sudo ./configure --prefix=/home/runner/im/imagemagick-${{ matrix.imagemagick }}
            sudo make -j$(nproc)
            sudo make install
          )

      - name: Cache Imagick PHP extension
        uses: actions/cache@v4
        id: cache-imagick-ext
        with:
          path: /home/runner/imagick-ext/imagick-${{ matrix.imagick }}-php${{ matrix.php }}
          key: ${{ runner.os }}-imagick-ext-${{ matrix.imagick }}-php${{ matrix.php }}-${{ matrix.imagemagick }}

      - name: Build Imagick PHP extension
        if: steps.cache-imagick-ext.outputs.cache-hit != 'true'
        run: |
          curl -o /tmp/imagick.tgz -sL http://pecl.php.net/get/imagick-${{ matrix.imagick }}.tgz
          mkdir -p /home/runner/imagick-ext/imagick-${{ matrix.imagick }}-php${{ matrix.php }}
          (
            cd /tmp || exit 1
            tar -xzf imagick.tgz
            cd imagick-${{ matrix.imagick }}
            phpize
            ./configure --with-imagick=/home/runner/im/imagemagick-${{ matrix.imagemagick }}
            make -j$(nproc)
            cp modules/imagick.so /home/runner/imagick-ext/imagick-${{ matrix.imagick }}-php${{ matrix.php }}/imagick.so
          )

      - name: Enable Imagick PHP extension
        run: |
          sudo cp /home/runner/imagick-ext/imagick-${{ matrix.imagick }}-php${{ matrix.php }}/imagick.so "$(php -r 'echo ini_get("extension_dir");')/imagick.so"
          sudo bash -c 'echo "extension=imagick.so" >> /etc/php/${{ matrix.php }}/cli/php.ini'
          php --ri imagick

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Install optimizers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jpegoptim pngquant gifsicle optipng libjpeg-progs webp
          npm install -g svgo

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-suggest

      - name: GD Version
        run: php -r 'var_dump(gd_info());'

      - name: Imagick Version
        run: php -r 'var_dump(Imagick::getVersion());'

      - name: Supported Imagick Formats
        run: php -r 'var_dump(Imagick::queryFormats());'

      - name: Execute tests
        run: composer test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
